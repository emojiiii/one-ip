name: Sync upstream

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.fork && (github.event_name == 'workflow_dispatch' || vars.AUTO_SYNC_UPSTREAM == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Sync without overwriting fork changes
        shell: bash
        run: |
          set -euo pipefail
          branch=$(gh api "repos/$REPO" --jq '.default_branch')
          # The GitHub merge-upstream endpoint fails on conflicts; no force reset.
          gh api --method POST "repos/$REPO/merge-upstream" -f branch="$branch"
